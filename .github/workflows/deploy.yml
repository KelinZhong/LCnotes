name: Deploy Jupyter Book

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # -W turns Sphinx warnings into errors so broken references and bad
      # heading structure fail the build instead of shipping silently.
      # --keep-going reports every problem in one run rather than the first.
      - name: Build the book
        run: jupyter-book build . -W --keep-going

      - name: Deploy to GitHub Pages
        run: ghp-import -n -p -f _build/html
